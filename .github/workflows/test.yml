# Installs the formula from this checkout on real macOS and Linux runners, so
# a formula that doesn't install never sits on main unnoticed.
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main
      # setup-homebrew has already registered this checkout as mckoy-labs/tap.
      - name: Install from this checkout
        run: brew install mckoy-labs/tap/spotagentiq
      - name: Run it
        run: |
          spotagentiq version
          brew test mckoy-labs/tap/spotagentiq
